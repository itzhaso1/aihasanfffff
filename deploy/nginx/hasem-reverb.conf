# Nginx Reverse Proxy Configuration for Laravel Reverb (WebSocket)
# Include this block inside your main HTTPS server block (e.g. /etc/nginx/sites-available/hasem)
# or include it directly: include /var/www/hasem/deploy/nginx/hasem-reverb.conf;

# 1. Connection Upgrade Mapping (place inside http block if not already present)
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# 2. Reverb WebSocket Endpoint
location ~ ^/(app|apps)/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Upgrade Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # WebSocket Timeouts & Buffering for low latency
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_cache off;
}
