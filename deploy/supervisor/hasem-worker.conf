; HASEM general default-queue worker. No secrets in this file.
; P0 uses multiple Supervisor programs (emails, inbound, ai, general) — see deploy/supervisor/*.conf
; Install all templates, then: supervisorctl reread && supervisorctl update

[program:hasem-worker]
process_name=%(program_name)s_%(process_num)02d
command=/opt/alt/php83/usr/bin/php /var/www/hasem/artisan queue:work redis --queue=default --sleep=1 --tries=3 --backoff=5 --timeout=200 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=210
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hasem/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
