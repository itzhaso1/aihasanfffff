; HASEM email sync queue worker. No secrets in this file.
; Install: copy to /etc/supervisor/conf.d/hasem-worker-emails.conf
; Then: supervisorctl reread && supervisorctl update

[program:hasem-worker-emails]
process_name=%(program_name)s_%(process_num)02d
command=/opt/alt/php83/usr/bin/php /var/www/hasem/artisan queue:work redis --queue=emails --sleep=1 --tries=3 --backoff=5 --timeout=200 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=210
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hasem/storage/logs/worker-emails.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
