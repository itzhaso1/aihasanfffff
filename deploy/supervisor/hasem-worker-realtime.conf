; HASEM realtime broadcast queue worker (MessageCreated / ConversationUpdated jobs).
; Install: copy to /etc/supervisor/conf.d/hasem-worker-realtime.conf

[program:hasem-worker-realtime]
process_name=%(program_name)s_%(process_num)02d
command=/opt/alt/php83/usr/bin/php /var/www/hasem/artisan queue:work redis --queue=realtime --sleep=1 --tries=3 --backoff=3 --timeout=60 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=90
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hasem/storage/logs/worker-realtime.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
