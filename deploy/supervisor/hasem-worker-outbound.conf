; HASEM channel outbound (WhatsApp Graph, Instagram, Facebook when merged).
; Install: copy to /etc/supervisor/conf.d/hasem-worker-outbound.conf

[program:hasem-worker-outbound]
process_name=%(program_name)s_%(process_num)02d
command=/opt/alt/php83/usr/bin/php /var/www/hasem/artisan queue:work redis --queue=outbound --sleep=1 --tries=3 --backoff=10 --timeout=200 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=210
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hasem/storage/logs/worker-outbound.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
