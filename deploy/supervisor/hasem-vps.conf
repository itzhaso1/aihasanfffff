; ==============================================================================
; HASEM Combined Supervisor Configuration for VPS
; Path: /home/deploy/aihasan/aihasan (User: deploy)
; Install:
;   sudo cp /home/deploy/aihasan/aihasan/deploy/supervisor/hasem-vps.conf /etc/supervisor/conf.d/hasem.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl restart all
; ==============================================================================

[program:hasem-reverb]
process_name=%(program_name)s
command=php /home/deploy/aihasan/aihasan/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/deploy/aihasan/aihasan
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
numprocs=1
user=deploy
redirect_stderr=true
stdout_logfile=/home/deploy/aihasan/aihasan/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:hasem-worker-realtime]
process_name=%(program_name)s_%(process_num)02d
command=php /home/deploy/aihasan/aihasan/artisan queue:work --queue=realtime --sleep=1 --tries=3 --backoff=3 --timeout=60 --max-time=3600
directory=/home/deploy/aihasan/aihasan
autostart=true
autorestart=true
stopwaitsecs=90
stopasgroup=true
killasgroup=true
numprocs=2
user=deploy
redirect_stderr=true
stdout_logfile=/home/deploy/aihasan/aihasan/storage/logs/worker-realtime.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

