; Laravel Reverb WebSocket server. No secrets in this file.
; Install: copy to /etc/supervisor/conf.d/hasem-reverb.conf
; Ensure REVERB_* and BROADCAST_CONNECTION=reverb are set in the host .env.

[program:hasem-reverb]
process_name=%(program_name)s
command=/opt/alt/php83/usr/bin/php /var/www/hasem/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hasem/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
