; HASEM default-queue worker pool (inbound Meta messages, outbound sends, etc.).
; P0: all non-email jobs use the "default" queue. P1 will split dedicated inbound/realtime queues.
; Install: copy to /etc/supervisor/conf.d/hasem-worker-inbound.conf

[program:hasem-worker-inbound]
process_name=%(program_name)s_%(process_num)02d
command=/opt/alt/php83/usr/bin/php /var/www/hasem/artisan queue:work redis --queue=inbound --sleep=1 --tries=3 --backoff=5 --timeout=200 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=210
stopasgroup=true
killasgroup=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hasem/storage/logs/worker-inbound.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
