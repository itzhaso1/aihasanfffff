name: hasim
description: "حاسم — تطبيق Flutter لـ Mobile API v1 (عربي RTL)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.11.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  hive_flutter: ^1.1.0
  drift: ^2.26.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.6.0
  connectivity_plus: ^6.1.4
  image_picker: ^1.2.2
  file_picker: ^8.3.7
  google_fonts: ^6.2.1
  collection: ^1.19.1
  equatable: ^2.1.0
  path_provider: ^2.1.5
  state_notifier: ^1.0.0
  google_sign_in: ^6.2.2
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.1
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  build_runner: ^2.7.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/hasim_mark.png
    - assets/branding/splash_bg.png
    - assets/branding/hasim_splash.png
    - assets/branding/hasim_login.png
    - assets/branding/splash/
