services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hasem-app
    restart: unless-stopped
    working_dir: /var/www/hasem
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/var/www/hasem/storage
    networks:
      - hasem

  mysql:
    image: mysql:8.4
    container_name: hasem-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hasem

  redis:
    image: redis:7-alpine
    container_name: hasem-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hasem

volumes:
  mysql_data:
  redis_data:
  storage:

networks:
  hasem:
    driver: bridge
